name: "技术文档"
description: "适用于 API 文档、架构说明、操作手册等技术写作场景"
tone: "严谨、简洁、中性"
vocabulary_level: "专业技术"
formatting_rules:
  - "使用标准 Markdown 标题层次（h2-h4）"
  - "代码块标注语言类型"
  - "步骤说明使用有序列表"
  - "参数和配置使用表格展示"
  - "包含前置条件和注意事项"
  - "关键术语首次出现时给出解释"
forbidden_patterns:
  - "emoji"
  - "口语化表达"
  - "模糊用词（大概、可能、也许）"
  - "缺少上下文的代词（这个、那个）"
