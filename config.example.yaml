# doc-agent configuration
server:
  host: "127.0.0.1"
  port: 3966
  reload: true

model:
  # Provider: anthropic, openai, ollama
  provider: "anthropic"
  name: "claude-sonnet-4-20250514"
  temperature: 0.3
  max_tokens: 4096

style:
  # Writing style preferences
  tone: "professional"
  language: "zh-CN"
  # Custom templates directory (optional)
  templates_dir: null

workspace:
  # Root directory for documentation projects
  root: "."
  # Auto-detect git repository
  auto_detect_git: true
  # Branch naming pattern for doc branches
  branch_prefix: "docs/"

agent:
  # Multi-step agent loop (tool use) settings
  max_steps: 10           # max tool-use iterations before forcing a stop
  token_budget: 0         # cumulative output-token budget; 0 = unlimited
  enable_web_search: true
  search:
    # Web search backend: duckduckgo (no key) | tavily | brave
    provider: "duckduckgo"
    # Env var holding the API key for tavily/brave (leave null for duckduckgo)
    api_key_env: null
