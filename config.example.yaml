# doc-agent configuration
# Copy to ./config.yaml (or ~/.doc-agent/config.yaml) and fill in your values.
# config.yaml is gitignored — never commit real API keys.

server:
  host: "127.0.0.1"
  port: 3966
  auto_open_browser: true

model:
  # cloud: Anthropic / OpenAI-compatible endpoint; local: Ollama
  provider: "cloud"
  cloud:
    service: "openai"                 # "anthropic" | "openai"
    model: "gpt-4o"                   # e.g. gpt-4o, claude-sonnet-4-20250514, deepseek-chat
    # Name of the env var holding your API key (recommended over api_key below)
    api_key_env: "OPENAI_API_KEY"     # use "ANTHROPIC_API_KEY" for anthropic
    # Direct API key (takes precedence over env var; avoid committing!)
    api_key: null
    # Custom base URL for OpenAI-compatible APIs (DeepSeek, Moonshot, etc.)
    base_url: null                    # e.g. "https://api.deepseek.com/v1"
  local:
    service: "ollama"
    model: "llama3"
    endpoint: "http://localhost:11434"
  fallback: false

style:
  # Writing style preferences
  default_template: null
  habit_profile: null

workspace:
  # Root directory for documentation projects
  path: "~/.doc-agent/workspace"

agent:
  # Multi-step agent loop (tool use) settings
  max_steps: 10           # max tool-use iterations before forcing a stop
  token_budget: 0         # cumulative output-token budget; 0 = unlimited
  enable_web_search: true
  search:
    # Web search backend: duckduckgo (no key) | tavily | brave | bocha
    provider: "duckduckgo"
    # Env var holding the API key for tavily/brave/bocha (leave null for duckduckgo)
    api_key_env: null
    api_key: null
