[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-agent"
version = "1.1.0"
description = "AI-powered documentation editing assistant with Cursor-like experience"
authors = [{name = "Doc-Agent Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1.0",
    "anthropic>=0.28.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0",
    "structlog>=24.0.0",
    "ddgs>=6.0",
]

[project.scripts]
doc-agent = "doc_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["doc_agent*"]
